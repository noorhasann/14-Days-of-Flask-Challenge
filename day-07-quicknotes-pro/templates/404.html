<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .error-card {
            max-width: 450px;
            text-align: center;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="card border-0 shadow-lg p-4 error-card">
    <div class="card-body">
        <div class="error-code">404</div>
        <h3 class="card-title fw-bold">Oops! Lost in Space?</h3>
        <p class="card-text text-muted my-3">
            The page or note route you are looking for doesn't exist or has been moved.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2 mt-2">
            ⬅️ Back to Home
        </a>
    </div>
</div>

</body>
</html>
