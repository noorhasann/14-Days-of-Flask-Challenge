<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f8; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        input[type="text"], textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; }
        .btn-update { background-color: #007bff; color: white; }
        .btn-cancel { background-color: #6c757d; color: white; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>✏️ Edit Note</h2>
        
        <!-- UPDATE FORM -->
        <form action="/edit/{{ note.id }}" method="POST">
            <label>Title:</label>
            <input type="text" name="title" value="{{ note.title }}" required>

            <label>Content:</label>
            <textarea name="content" rows="5" required>{{ note.content }}</textarea>

            <button type="submit" class="btn btn-update">Save Changes</button>
            <a href="/" class="btn btn-cancel">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
