<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 06 - Full CRUD Notes Manager</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f8; color: #333; }
        .container { max-width: 650px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        input[type="text"], textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-edit { background-color: #ffc107; color: #212529; margin-right: 8px; }
        .btn-delete { background-color: #dc3545; color: white; }
        .actions { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Day 06: Full CRUD Notes Manager</h2>

    <!-- CREATE FORM -->
    <div class="card">
        <h3>Add New Note</h3>
        <form action="/" method="POST">
            <input type="text" name="title" placeholder="Title..." required>
            <textarea name="content" rows="3" placeholder="Write your note here..." required></textarea>
            <button type="submit" class="btn btn-add">Save Note</button>
        </form>
    </div>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- READ & DISPLAY NOTES -->
    <h3>Your Saved Notes</h3>
    {% if notes %}
        {% for note in notes %}
            <div class="card">
                <h4>{{ note.title }}</h4>
                <p>{{ note.content }}</p>

                <!-- DYNAMIC EDIT & DELETE LINKS -->
                <div class="actions">
                    <a href="/edit/{{ note.id }}" class="btn btn-edit">✏️ Edit</a>
                    <a href="/delete/{{ note.id }}" 
                       onclick="return confirm('Kya aap sach mein ise delete karna chahte hain?');" 
                       class="btn btn-delete">🗑️ Delete</a>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p style="color: #666;">Koi notes nahi mile. Upar diye gaye form se naya note banayein!</p>
    {% endif %}
</div>

</body>
</html>
